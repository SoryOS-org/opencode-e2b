<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Box mode</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #f5f5f5;
      }
      svg {
        display: block;
        width: 1000px;
        height: 328px;
      }
    </style>
  </head>
  <body>
    <svg
      viewBox="0 72 1000 328"
      xmlns="http://www.w3.org/2000/svg"
      role="img"
      aria-labelledby="box-title box-desc"
    >
      <title id="box-title">Box mode</title>
      <desc id="box-desc">
        opencode-e2b box up uploads the project with its git history to an E2B box running OpenCode. Your TUI
        attaches to it. The model key is an E2B secret, added to model API requests by the E2B egress proxy.
        box pull brings the work home as branch e2b/name.
      </desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />
        </marker>
      </defs>

      <rect x="0" y="0" width="1000" height="500" fill="#f5f5f5" />

      <!-- zone: E2B. The model API is outside it. -->
      <rect
        x="456"
        y="104"
        width="296"
        height="208"
        rx="8"
        fill="rgba(45,49,66,0.02)"
        stroke="rgba(45,49,66,0.10)"
        stroke-width="0.8"
      />
      <rect x="472" y="108" width="80" height="12" rx="2" fill="#f5f5f5" />
      <text
        x="512"
        y="117"
        fill="rgba(45,49,66,0.40)"
        font-size="7"
        font-family="'Geist Mono', monospace"
        text-anchor="middle"
        letter-spacing="0.14em"
      >
        E2B CLOUD
      </text>

      <!-- arrows first -->
      <line
        x1="272"
        y1="192"
        x2="490"
        y2="192"
        stroke="#eb6c36"
        stroke-width="1.2"
        marker-end="url(#arrow-accent)"
      />
      <line
        x1="272"
        y1="232"
        x2="490"
        y2="232"
        stroke="#4f5d75"
        stroke-width="1"
        stroke-dasharray="4,3"
        marker-end="url(#arrow)"
      />
      <line
        x1="696"
        y1="208"
        x2="802"
        y2="208"
        stroke="#4f5d75"
        stroke-width="1.2"
        marker-end="url(#arrow)"
      />
      <path
        d="M 596,264 V 360 Q 596,368 588,368 H 176 Q 168,368 168,360 V 270"
        fill="none"
        stroke="#4f5d75"
        stroke-width="1"
        stroke-dasharray="4,3"
        marker-end="url(#arrow)"
      />

      <!-- arrow labels -->
      <rect x="359.2" y="172" width="45.6" height="14" rx="2" fill="#f5f5f5" />
      <text
        x="382"
        y="182"
        fill="#4f5d75"
        font-size="9"
        font-family="'Geist Mono', monospace"
        text-anchor="middle"
        letter-spacing="0.04em"
      >
        box up
      </text>
      <rect x="338.2" y="200" width="87.6" height="14" rx="2" fill="#f5f5f5" />
      <text
        x="382"
        y="210"
        fill="#7a8399"
        font-size="8"
        font-family="'Geist Mono', monospace"
        text-anchor="middle"
        letter-spacing="0.06em"
      >
        PROJECT + .GIT
      </text>
      <rect x="317.2" y="240" width="129.6" height="14" rx="2" fill="#f5f5f5" />
      <text
        x="382"
        y="250"
        fill="#4f5d75"
        font-size="9"
        font-family="'Geist Mono', monospace"
        text-anchor="middle"
        letter-spacing="0.04em"
      >
        box attach (your TUI)
      </text>
      <rect x="294.8" y="348" width="174.4" height="14" rx="2" fill="#f5f5f5" />
      <text
        x="382"
        y="358"
        fill="#4f5d75"
        font-size="9"
        font-family="'Geist Mono', monospace"
        text-anchor="middle"
        letter-spacing="0.04em"
      >
        box pull -&gt; branch e2b/&lt;name&gt;
      </text>
      <rect x="719" y="188" width="66" height="14" rx="2" fill="#f5f5f5" />
      <text
        x="752"
        y="198"
        fill="#7a8399"
        font-size="8"
        font-family="'Geist Mono', monospace"
        text-anchor="middle"
        letter-spacing="0.06em"
      >
        E2B SECRET
      </text>
      <rect x="721.7" y="216" width="60.6" height="14" rx="2" fill="#f5f5f5" />
      <text
        x="752"
        y="226"
        fill="#7a8399"
        font-size="8"
        font-family="'Geist Mono', monospace"
        text-anchor="middle"
        letter-spacing="0.06em"
      >
        VIA PROXY
      </text>

      <rect x="64" y="152" width="208" height="112" rx="6" fill="#f5f5f5" />
      <rect
        x="64"
        y="152"
        width="208"
        height="112"
        rx="6"
        fill="rgba(79,93,117,0.10)"
        stroke="#7a8399"
        stroke-width="1"
      />
      <rect
        x="72"
        y="158"
        width="44"
        height="12"
        rx="2"
        fill="transparent"
        stroke="rgba(122,131,153,0.40)"
        stroke-width="0.8"
      />
      <text
        x="94"
        y="167"
        fill="#7a8399"
        font-size="7"
        font-family="'Geist Mono', monospace"
        text-anchor="middle"
        letter-spacing="0.08em"
      >
        LOCAL
      </text>
      <text
        x="168"
        y="204"
        fill="#2d3142"
        font-size="12"
        font-weight="600"
        font-family="'Geist', sans-serif"
        text-anchor="middle"
      >
        Your branch
      </text>
      <text
        x="168"
        y="226"
        fill="#4f5d75"
        font-size="9"
        font-family="'Geist Mono', monospace"
        text-anchor="middle"
      >
        tracked + uncommitted
      </text>
      <text
        x="168"
        y="242"
        fill="#7a8399"
        font-size="9"
        font-family="'Geist Mono', monospace"
        text-anchor="middle"
      >
        OpenCode TUI
      </text>

      <rect x="496" y="152" width="200" height="112" rx="6" fill="#f5f5f5" />
      <rect
        x="496"
        y="152"
        width="200"
        height="112"
        rx="6"
        fill="rgba(235,108,54,0.08)"
        stroke="#eb6c36"
        stroke-width="1"
      />
      <rect
        x="504"
        y="158"
        width="32"
        height="12"
        rx="2"
        fill="transparent"
        stroke="rgba(235,108,54,0.40)"
        stroke-width="0.8"
      />
      <text
        x="520"
        y="167"
        fill="#eb6c36"
        font-size="7"
        font-family="'Geist Mono', monospace"
        text-anchor="middle"
        letter-spacing="0.08em"
      >
        BOX
      </text>
      <text
        x="596"
        y="204"
        fill="#2d3142"
        font-size="12"
        font-weight="600"
        font-family="'Geist', sans-serif"
        text-anchor="middle"
      >
        OpenCode server
      </text>
      <text
        x="596"
        y="226"
        fill="#4f5d75"
        font-size="9"
        font-family="'Geist Mono', monospace"
        text-anchor="middle"
      >
        same path as yours
      </text>
      <text
        x="596"
        y="242"
        fill="#7a8399"
        font-size="9"
        font-family="'Geist Mono', monospace"
        text-anchor="middle"
      >
        one per task
      </text>

      <rect x="808" y="152" width="152" height="112" rx="6" fill="#f5f5f5" />
      <rect
        x="808"
        y="152"
        width="152"
        height="112"
        rx="6"
        fill="#ffffff"
        stroke="#2d3142"
        stroke-width="1"
      />
      <rect
        x="816"
        y="158"
        width="44"
        height="12"
        rx="2"
        fill="transparent"
        stroke="rgba(45,49,66,0.40)"
        stroke-width="0.8"
      />
      <text
        x="838"
        y="167"
        fill="rgba(45,49,66,0.80)"
        font-size="7"
        font-family="'Geist Mono', monospace"
        text-anchor="middle"
        letter-spacing="0.08em"
      >
        MODEL
      </text>
      <text
        x="884"
        y="204"
        fill="#2d3142"
        font-size="12"
        font-weight="600"
        font-family="'Geist', sans-serif"
        text-anchor="middle"
      >
        Model API
      </text>
      <text
        x="884"
        y="226"
        fill="#4f5d75"
        font-size="9"
        font-family="'Geist Mono', monospace"
        text-anchor="middle"
      >
        Anthropic, OpenAI
      </text>
      <text
        x="884"
        y="242"
        fill="#7a8399"
        font-size="9"
        font-family="'Geist Mono', monospace"
        text-anchor="middle"
      >
        box holds no key
      </text>
    </svg>
  </body>
</html>
